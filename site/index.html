<title>EduMate — o'qituvchi yordamchisi</title>
<meta name="description" content="EduMate diktant va yozma ishlarni rasmdan tekshiradi: xatolarni topadi, qizil ruchkada belgilaydi va baho qo'yadi.">
<link rel="icon" href="logo.svg"><link rel="apple-touch-icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: warm, confident school project; plain words for teachers
   IDEA: a school notebook checked with a red pen
   PICTURE: lined notebook page with red corrections and a circled grade, on school-ink blue
   COLOUR and TYPE: ink blue #1f3a93, red pen #d62f2f, paper white; Manrope + Caveat handwriting accents
   LAYOUT: full-width blue hero, then calm white bands: numbers, steps, features, start, author */
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e1220);--alt:light-dark(#f4f6fb,#141a2c);--card:light-dark(#fff,#171c2e);--ink:light-dark(#141a2e,#e9ecf7);--mut:light-dark(#5c6480,#9aa3c0);--line:light-dark(#dfe3ef,#2a3150);--blue:#1f3a93;--blueT:light-dark(#1f3a93,#8aa5ff);--blueBg:light-dark(#e8edfb,#1d2747);--red:#d62f2f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Manrope,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.wrap{max-width:1140px;margin:0 auto;padding:0 max(5vw,18px)}
.band{padding:clamp(48px,7vw,88px) 0}
.alt{background:var(--alt)}
h1,h2,h3{line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(28px,3.6vw,40px);font-weight:800;letter-spacing:-.015em;margin-bottom:14px}
h3{font-size:19px;margin-bottom:6px}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--mut);max-width:62ch;margin:0 0 28px}
.hand{font-family:Caveat,cursive;font-weight:700}
/* nav */
nav{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;box-shadow:0 2px 12px #0b164033}
nav .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;text-decoration:none;color:#fff}
.links{display:flex;gap:22px;margin-left:auto;font-weight:600;font-size:15px}
.links a{text-decoration:none;opacity:.85}.links a:hover{opacity:1}
#lang{font:700 14px Manrope,system-ui,sans-serif;background:#ffffff1f;color:#fff;border:1px solid #ffffff55;border-radius:10px;padding:8px 10px;min-height:40px}
#lang option{color:#141a2e}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px Manrope,system-ui,sans-serif;min-height:48px;padding:12px 22px;border-radius:12px;text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 14px #d62f2f55}
.btn.red:hover{background:#c02525}
.btn.ghost{border-color:#ffffff88;color:#fff}
.btn.ghost:hover{background:#ffffff1a}
.btn.small{min-height:40px;padding:8px 16px;font-size:15px}
.btn:focus-visible,#lang:focus-visible,a:focus-visible{outline:3px solid #ffd34d;outline-offset:2px}
/* hero */
.hero{background:var(--blue);color:#fff;padding:clamp(40px,6vw,80px) 0 clamp(48px,7vw,96px);position:relative;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,4vw,56px);align-items:center}
.hero .tag{display:inline-block;font-family:Caveat,cursive;font-size:26px;color:#ffd34d;margin-bottom:6px}
.hero p{color:#dfe6ff;font-size:clamp(17px,1.6vw,20px);margin:18px 0 30px;max-width:52ch}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.hero svg{width:100%;height:auto;display:block;filter:drop-shadow(0 20px 30px #0b164066)}
/* numbers */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.num b{display:block;font-size:clamp(34px,4vw,48px);line-height:1;color:var(--blueT);font-weight:800;white-space:nowrap}
.num.hot b{color:var(--red)}
.num span{display:block;margin-top:8px;color:var(--mut);font-size:15px}
.compare{margin-top:28px;display:grid;gap:10px;max-width:760px}
.bar{display:grid;grid-template-columns:9em minmax(0,1fr);align-items:center;gap:12px;font-size:15px;font-weight:600}
.bar i{display:block;height:34px;border-radius:8px;background:var(--line);position:relative}
.bar i::after{content:attr(data-v);position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-weight:800;color:var(--ink);white-space:nowrap}
.bar.fast i{background:var(--red)}.bar.fast i::after{right:auto;left:calc(100% + 10px);color:var(--red)}
/* steps */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--blueBg);color:var(--blueT);font-weight:800;font-size:20px;margin-bottom:14px}
.step p{margin:0;color:var(--mut);font-size:16px}
/* features */
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.feat{padding:22px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.feat svg{width:40px;height:40px;margin-bottom:12px}
.feat p{margin:0;color:var(--mut);font-size:16px}
.langs{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.langs span{padding:8px 16px;border-radius:99px;background:var(--blueBg);color:var(--blueT);font-weight:700;font-size:15px}
/* start */
.start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.start ol{margin:0;padding-left:22px;display:grid;gap:12px}
.start li{padding-left:4px}
.note{background:var(--blueBg);border-radius:14px;padding:16px 18px;font-size:15px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
/* author */
.author{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ava{width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 40px Caveat,cursive;flex:none}
.author p{margin:4px 0 0;color:var(--mut)}
footer{background:var(--blue);color:#cdd7ff;padding:28px 0;font-size:15px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
@media(max-width:900px){.hero .wrap,.start{grid-template-columns:1fr}.nums{grid-template-columns:repeat(2,minmax(0,1fr))}.steps,.feats{grid-template-columns:1fr 1fr}.links{display:none}#lang{margin-left:auto}}
@media(max-width:600px){.steps,.feats{grid-template-columns:1fr}.bar{grid-template-columns:7em minmax(0,1fr)}nav .btn.small{display:none}}
@media(prefers-reduced-motion:no-preference){.pen{animation:pen 3.5s ease-in-out infinite}@keyframes pen{50%{transform:translate(-4px,6px)}}}
</style>
</head>

<nav>
  <div class="wrap">

    <select id="lang" aria-label="Til / Язык / Language"><option value="uz">O'zbek</option><option value="ru">Русский</option><option value="en">English</option><option value="tg">Тоҷикӣ</option></select>

</nav>

      </g>
      <g transform="translate(500 40) rotate(35)"><g class="pen"><rect width="20" height="220" rx="5" fill="#d62f2f"/><rect width="20" height="34" fill="#a11f1f"/><path d="M0 220l10 28 10-28z" fill="#f5d6b0"/><path d="M6 238l4 10 4-10z" fill="#d62f2f"/></g></g>
    </svg>
  </div>
</header>

<section class="band">
  <div class="wrap">
    <h2 data-t="probH"></h2>
    <p class="lead" data-t="probP"></p>
    <div class="nums">
      <div class="num"><b data-t="n1"></b><span data-t="n1s"></span></div>
      <div class="num"><b data-t="n2"></b><span data-t="n2s"></span></div>
      <div class="num hot"><b data-t="n3"></b><span data-t="n3s"></span></div>
      <div class="num hot"><b data-t="n4"></b><span data-t="n4s"></span></div>
    </div>
    <div class="compare" aria-hidden="true">
      <div class="bar"><span data-t="byHand"></span><i id="b1" style="width:100%"></i></div>
      <div class="bar fast"><span>EduMate</span><i id="b2" style="width:17%"></i></div>
    </div>
  </div>
</section>

<section class="band alt" id="how">
  <div class="wrap">
    <h2 data-t="howH"></h2>
    <p class="lead" data-t="howP"></p>
    <div class="steps">
      <div class="step"><h3 data-t="s1h"></h3><p data-t="s1p"></p></div>
      <div class="step"><h3 data-t="s2h"></h3><p data-t="s2p"></p></div>
      <div class="step"><h3 data-t="s3h"></h3><p data-t="s3p"></p></div>
    </div>
  </div>
</section>

<section class="band" id="features">
  <div class="wrap">
    <h2 data-t="featH"></h2>
    <p class="lead" data-t="featP"></p>
    <div class="feats" id="feats"></div>
    <div class="langs"><span>O'zbek</span><span>Русский</span><span>English</span><span>Тоҷикӣ</span></div>
  </div>
</section>

<section class="band alt" id="start">
  <div class="wrap start">
    <div>
      <h2 data-t="startH"></h2>
      <p class="lead" data-t="startP"></p>
      <a class="btn red" href="app/" data-t="open"></a>
    </div>
    <div class="card">
      <h3 data-t="keyH"></h3>
      <ol id="keySteps"></ol>
      <div class="note" data-t="keyNote"></div>
    </div>
  </div>
</section>

<section class="band" id="author">
  <div class="wrap author">
    <div class="ava">Sh</div>
    <div><h3 data-t="authName"></h3><p data-t="authP"></p></div>
  </div>
</section>

<footer><div class="wrap"><span>© 2026 EduMate</span><span data-t="foot"></span></div></footer>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cfg={};try{cfg=JSON.parse(localStorage.getItem('em_cfg')||'{}')}catch(e){}
let lang=cfg.lang;if(!T[lang]){const n=(navigator.language||'uz').slice(0,2);lang=T[n]?n:'uz'}
function apply(){const L=T[lang];document.documentElement.lang=lang;$('#lang').value=lang;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=L[e.dataset.t]);
 $('#feats').innerHTML=L.feats.map((f,i)=>`<div class="feat">${ICONS[i]}<h3>${esc(f[0])}</h3><p>${esc(f[1])}</p></div>`).join('');
 $('#keySteps').innerHTML=L.keys.map(k=>`<li>${esc(k)}</li>`).join('');
 $('#b1').dataset.v=L.bar1;$('#b2').dataset.v=L.bar2;
 document.querySelectorAll('#heroLines text').forEach((t,i)=>t.textContent=L.lines[i]||'');
 $('#heroSvg').setAttribute('aria-label',L.aria);document.title='EduMate — '+L.tag}
$('#lang').addEventListener('change',()=>{lang=$('#lang').value;try{cfg=JSON.parse(localStorage.getItem('em_cfg')||'{}');cfg.lang=lang;localStorage.setItem('em_cfg',JSON.stringify(cfg))}catch(e){}apply()});
apply();
}
</script>
