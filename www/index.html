<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, practical teacher's tool; quick to use between lessons
   IDEA: a school notebook checked with a red pen
   PICTURE: lined notebook page with red corrections and a circled grade
   COLOUR and TYPE: paper white, school-ink blue #1f3a93, red pen #d62f2f; Manrope + Caveat for handwriting
   LAYOUT: phone app: header, one working column, bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#f6f7fb,#0e1220);--card:light-dark(#fff,#171c2e);--ink:light-dark(#141a2e,#e9ecf7);--mut:light-dark(#5c6480,#9aa3c0);--line:light-dark(#dfe3ef,#2a3150);--blue:light-dark(#1f3a93,#7d9bff);--blueBg:light-dark(#e8edfb,#1d2747);--red:#d62f2f;--redBg:light-dark(#fdecec,#3a1a1f);--ok:light-dark(#137a43,#4fd18b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
header{background:var(--blue);color:#fff;padding:16px max(4vw,16px) 18px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
header .hand{font-family:Caveat,cursive;font-size:22px;opacity:.85;margin-left:auto}
:root:not([data-theme=light]) header{background:light-dark(#1f3a93,#16234d)}
main{max-width:720px;margin:0 auto;padding:16px max(4vw,14px)}
h2{font-size:24px;line-height:1.15;margin:8px 0 12px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:clamp(22px,6vw,30px);line-height:1.1;color:var(--blue)}
.stat span{font-size:13px;color:var(--mut)}
.hero{display:grid;gap:14px}
.hero svg{width:100%;height:auto;display:block;border-radius:16px}
button,.btn{font:600 16px Manrope,system-ui,sans-serif;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button.blue{background:var(--blue);border-color:var(--blue);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:16px Manrope,system-ui,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--blueBg);border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}
.seg button{border:0;background:transparent;min-height:40px}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px #0002}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative;width:72px;height:92px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs button{position:absolute;top:2px;right:2px;min-height:26px;width:26px;padding:0;border-radius:50%;font-size:14px;background:#000a;color:#fff;border:0}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.grade{width:68px;height:68px;border:3px solid var(--red);border-radius:50%;display:grid;place-items:center;font:700 40px Caveat,cursive;color:var(--red);transform:rotate(-8deg)}
.err{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.err .w{color:var(--red);text-decoration:line-through}
.err .c{color:var(--ok);font-weight:600}
.err .t{font-size:12px;background:var(--blueBg);color:var(--blue);padding:2px 8px;border-radius:99px;white-space:nowrap}
.err .x{margin-left:auto;min-height:34px;padding:4px 10px;font-size:13px}
.err .why{flex-basis:100%;font-size:13px;color:var(--mut)}
.err{flex-wrap:wrap}
.tr{font-family:Caveat,cursive;font-size:22px;line-height:1.35;background:repeating-linear-gradient(transparent 0 28.7px,var(--line) 28.7px 29.7px);padding:2px 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.tr mark{background:none;color:var(--red);text-decoration:underline wavy var(--red);text-underline-offset:4px}
details summary{cursor:pointer;color:var(--blue);font-weight:600;padding:6px 0}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.list .it:first-child{border-top:0}
.list .g{font:700 26px Caveat,cursive;color:var(--red);width:34px;text-align:center}
.list .n{flex:1}.list .n small{display:block;color:var(--mut);font-size:13px}
.note{background:var(--redBg);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.okmsg{background:var(--blueBg);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.prog{height:8px;background:var(--blueBg);border-radius:99px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;flex-direction:column;gap:2px;font-size:12px;min-height:56px;color:var(--mut);padding:4px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--blue)}
.steps{display:grid;gap:10px;counter-reset:s}
.steps div{display:flex;gap:12px;align-items:flex-start}
.steps div::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--blueBg);color:var(--blue);font-weight:800;display:grid;place-items:center}
.hide{display:none!important}
.spin{width:18px;height:18px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.prog i{transition:none}}
</style>
<style>
header #lang{width:auto;margin-left:auto;background:#ffffff1f;color:#fff;border:1px solid #ffffff55;min-height:40px;padding:6px 10px;font-weight:700;font-size:15px}
header #lang option{color:#141a2e}
header .hand{margin-left:0}
.btn{text-align:center;line-height:1.2}
@media(max-width:420px){header .hand{display:none}}
</style>
</head>
<body>
<header>
  <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="3" width="22" height="26" rx="3" fill="#fff"/><path d="M8 10h14M8 15h14M8 20h9" stroke="#1f3a93" stroke-width="2"/><path d="M17 24l3 3 7-9" stroke="#d62f2f" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
  <h1>EduMate</h1><span class="hand" data-t="tagline"></span>
  <select id="lang" aria-label="Til / Язык / Language"><option value="uz">O'zbek</option><option value="ru">Русский</option><option value="en">English</option><option value="tg">Тоҷикӣ</option></select>
</header>
<main>
<section id="v-home">
  <div class="hero">
    <svg viewBox="0 0 640 300" role="img" id="heroSvg">
      <rect width="640" height="300" fill="#1f3a93"/>
      <g transform="rotate(-3 320 150)">
        <rect x="70" y="40" width="430" height="250" rx="6" fill="#0d1d55" opacity=".5" transform="translate(8 10)"/>
        <rect x="70" y="40" width="430" height="250" rx="6" fill="#fff"/>
        <g stroke="#cfd8ee" stroke-width="1.5"><path d="M70 90h430M70 125h430M70 160h430M70 195h430M70 230h430M70 265h430"/></g>
        <path d="M120 40v250" stroke="#f2a0a0" stroke-width="2"/>
        <g font-family="Caveat,cursive" font-size="26" fill="#1f3a93" id="heroLines">
          <text x="135" y="84"></text><text x="135" y="119"></text><text x="135" y="154"></text><text x="135" y="189"></text>
        </g>
        <path d="M140 126q60 7 120 0" stroke="#d62f2f" stroke-width="3" fill="none"/>
        <path d="M300 196q50 6 100 0" stroke="#d62f2f" stroke-width="3" fill="none"/>
        <circle cx="440" cy="245" r="30" fill="none" stroke="#d62f2f" stroke-width="4"/>
        <text x="428" y="262" font-family="Caveat,cursive" font-size="48" font-weight="700" fill="#d62f2f">4</text>
      </g>
      <g transform="translate(520 60) rotate(35)"><rect width="16" height="170" rx="4" fill="#d62f2f"/><rect width="16" height="26" fill="#a11f1f"/><path d="M0 170l8 22 8-22z" fill="#f5d6b0"/><path d="M5 184l3 8 3-8z" fill="#d62f2f"/></g>
    </svg>
    <div>
      <h2 data-t="heroTitle"></h2>
      <p class="mut" style="margin-top:-4px" data-t="heroText"></p>
      <button class="pri" style="width:100%" data-go="check" data-t="ctaCheck"></button>
    </div>
  </div>
  <div class="stats" style="margin-top:16px">
    <div class="stat"><b id="sCount">0</b><span data-t="stCount"></span></div>
    <div class="stat"><b id="sSaved">0</b><span data-t="stSaved"></span></div>
    <div class="stat"><b id="sAvg">–</b><span data-t="stAvg"></span></div>
  </div>
  <div class="card">
    <h3 data-t="howTitle"></h3>
    <div class="steps">
      <div><span><b data-t="s1b"></b> <span class="mut" data-t="s1"></span></span></div>
      <div><span><b data-t="s2b"></b> <span class="mut" data-t="s2"></span></span></div>
      <div><span><b data-t="s3b"></b> <span class="mut" data-t="s3"></span></span></div>
    </div>
  </div>
</section>

<section id="v-check" class="hide">
  <h2 data-t="checkTitle"></h2>
  <div class="card">
    <div class="seg" role="tablist"><button id="mDict" class="on" data-t="mDict"></button><button id="mFree" data-t="mFree"></button></div>
    <div id="dictBox">
      <label for="taskSel" data-t="mDict"></label>
      <select id="taskSel"></select>
      <div id="newTask" class="hide">
        <label for="tTitle" data-t="lblTitle"></label><input id="tTitle" data-ph="phTitle">
        <label for="tClass" data-t="lblClass"></label><input id="tClass" placeholder="5-A">
        <label for="tText" data-t="lblText"></label><textarea id="tText" data-ph="phText"></textarea>
        <div class="row" style="margin-top:10px"><button class="blue" id="tSave" data-t="saveDict"></button><button id="tSample" data-t="sampleText"></button></div>
      </div>
    </div>
    <div id="freeBox" class="hide">
      <label for="fTask" data-t="lblTask"></label>
      <textarea id="fTask" data-ph="phTask"></textarea>
    </div>
  </div>
  <div class="card">
    <h3 data-t="worksTitle"></h3>
    <p class="mut" style="margin:0" data-t="worksHint"></p>
    <div class="row" style="margin-top:10px">
      <label class="btn blue" style="margin:0"><span data-t="cam"></span><input id="camIn" type="file" accept="image/*" capture="environment" class="hide"></label>
      <label class="btn" style="margin:0"><span data-t="gallery"></span><input id="galIn" type="file" accept="image/*" multiple class="hide"></label>
    </div>
    <button id="demoImg" style="width:100%;margin-top:10px" data-t="demoImg"></button>
    <div class="thumbs" id="thumbs"></div>
    <div id="checkMsg"></div>
    <div class="prog hide" id="prog"><i></i></div>
    <button class="pri" id="runBtn" style="width:100%;margin-top:10px" disabled></button>
  </div>
  <div id="results"></div>
</section>

<section id="v-journal" class="hide">
  <h2 data-t="navJournal"></h2>
  <div id="jList"></div>
  <div class="row"><button id="csvBtn" data-t="csv"></button></div>
  <div id="jDetail"></div>
</section>

<section id="v-set" class="hide">
  <h2 data-t="navSet"></h2>
  <div class="card">
    <h3 data-t="aiTitle"></h3>
    <p class="mut" style="margin-top:0" data-t="aiHint"></p>
    <label for="prov" data-t="service"></label>
    <select id="prov"><option value="auto" data-t="auto"></option><option value="gemini" data-t="gem"></option><option value="claude">Anthropic Claude</option></select>
    <label for="key" data-t="key"></label>
    <input id="key" type="password" autocomplete="off" data-ph="phKey">
    <p class="mut" data-t="keyHint"></p>
    <div id="aiStat" class="okmsg"></div>
  </div>
  <div class="card">
    <h3 data-t="gradeTitle"></h3>
    <p class="mut" style="margin-top:0" data-t="gradeHint"></p>
    <div class="row">
      <div><label for="g5" data-t="at5"></label><input id="g5" type="number" min="0" inputmode="numeric"></div>
      <div><label for="g4" data-t="at4"></label><input id="g4" type="number" min="0" inputmode="numeric"></div>
      <div><label for="g3" data-t="at3"></label><input id="g3" type="number" min="0" inputmode="numeric"></div>
    </div>
    <p class="mut" data-t="below"></p>
  </div>
  <div class="card"><button id="wipe" style="width:100%" data-t="wipe"></button><div id="wipeMsg"></div></div>
</section>
</main>

<nav>
  <button data-go="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg><span data-t="navHome"></span></button>
  <button data-go="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6l2-3h4l2 3"/></svg><span data-t="navCheck"></span></button>
  <button data-go="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h12a2 2 0 012 2v16H7a2 2 0 01-2-2z"/><path d="M9 8h6M9 12h6"/></svg><span data-t="navJournal"></span></button>
  <button data-go="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span data-t="navSet"></span></button>
</nav>

const LANGNAME={uz:'Uzbek (Latin script)',ru:'Russian',en:'English',tg:'Tajik (Cyrillic script)'};
const OLDTYPE={imlo:'spelling',ishora:'punct','tushib qolgan':'missing',ortiqcha:'extra'};

let mem={};
const store={get(k,d){try{const v=localStorage.getItem('em_'+k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},set(k,v){mem[k]=v;try{localStorage.setItem('em_'+k,JSON.stringify(v))}catch(e){}}};
let tasks=store.get('tasks',[]).filter(x=>x.id!=='t1');
let results=store.get('results',[]);
let cfg=Object.assign({prov:'auto',key:'',g5:0,g4:2,g3:5},store.get('cfg',{}));
if(!cfg.lang){const n=(navigator.language||'uz').slice(0,2);cfg.lang=T[n]?n:'uz'}
let L=T[cfg.lang];
const t=(k,...a)=>{const v=L[k]??T.uz[k];return typeof v==='function'?v(...a):v};
const typeName=ty=>L.types[OLDTYPE[ty]||ty]||ty;
let mode='dict',queue=[],sample=null,curView='home';

function applyLang(){
 L=T[cfg.lang];document.documentElement.lang=cfg.lang;$('#lang').value=cfg.lang;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('#heroSvg').setAttribute('aria-label',t('heroAria'));
 const words=L.sWritten.split('\n')[1].split(' ');const lines=[];let cur='';words.forEach(w=>{if((cur+' '+w).length>22&&cur){lines.push(cur);cur=w}else cur=cur?cur+' '+w:w});lines.push(cur);
 document.querySelectorAll('#heroLines text').forEach((e,i)=>e.textContent=lines[i]||'');
 renderTasks($('#taskSel').value);renderQueue();renderStats();if(curView==='journal')renderJournal();if(curView==='set')renderSet()}
$('#lang').addEventListener('change',()=>{cfg.lang=$('#lang').value;store.set('cfg',cfg);applyLang()});

/* ---------- navigation ---------- */
const views=['home','check','journal','set'];
function go(v){curView=v;views.forEach(x=>$('#v-'+x).classList.toggle('hide',x!==v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));if(v==='home')renderStats();if(v==='journal')renderJournal();if(v==='set')renderSet();scrollTo(0,0)}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

/* ---------- grading ---------- */
function score(errs){let s=0,p=0;errs.forEach(e=>(OLDTYPE[e.type]||e.type)==='punct'?p++:s++);return s+Math.floor(p/2)}
function grade(errs){const n=score(errs);return n<=cfg.g5?5:n<=cfg.g4?4:n<=cfg.g3?3:2}
const avg=rs=>(rs.reduce((a,r)=>a+grade(r.errors),0)/rs.length).toFixed(1);
function renderStats(){$('#sCount').textContent=results.length;$('#sSaved').textContent=Math.round(results.length*2.5);$('#sAvg').textContent=results.length?avg(results):'–'}

/* ---------- tasks ---------- */
function sampleTask(){const id='sample-'+cfg.lang;if(!tasks.some(x=>x.id===id)){tasks.unshift({id,title:L.sTitle+' ('+L.sample+')',cls:'5-A',text:L.sText});store.set('tasks',tasks)}return id}
function renderTasks(sel){if(!tasks.length)sampleTask();$('#taskSel').innerHTML=tasks.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}${x.cls?' · '+esc(x.cls):''}</option>`).join('')+`<option value="new">${esc(t('newDict'))}</option>`;if(sel&&(sel==='new'||tasks.some(x=>x.id===sel)))$('#taskSel').value=sel;$('#newTask').classList.toggle('hide',$('#taskSel').value!=='new')}
$('#taskSel').addEventListener('change',()=>$('#newTask').classList.toggle('hide',$('#taskSel').value!=='new'));
$('#tSample').addEventListener('click',()=>{$('#tTitle').value=L.sTitle;$('#tClass').value='5-A';$('#tText').value=L.sText});
$('#tSave').addEventListener('click',()=>{const text=$('#tText').value.trim(),title=$('#tTitle').value.trim()||t('mDict');if(!text){$('#tText').focus();return}const x={id:'t'+Date.now(),title,cls:$('#tClass').value.trim(),text};tasks.push(x);store.set('tasks',tasks);['#tTitle','#tClass','#tText'].forEach(s=>$(s).value='');renderTasks(x.id)});
function setMode(m){mode=m;$('#mDict').classList.toggle('on',m==='dict');$('#mFree').classList.toggle('on',m==='free');$('#dictBox').classList.toggle('hide',m!=='dict');$('#freeBox').classList.toggle('hide',m!=='free')}
$('#mDict').addEventListener('click',()=>setMode('dict'));$('#mFree').addEventListener('click',()=>setMode('free'));

/* ---------- images ---------- */
function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);c.toBlob(b=>b?res(b):rej(new Error(t('badImg'))),'image/jpeg',.85)};img.onerror=()=>rej(new Error(t('badImg')));img.src=URL.createObjectURL(file)})}
async function addFiles(fl){for(const f of fl){try{const b=await shrink(f);queue.push({blob:b,url:URL.createObjectURL(b)})}catch(e){msg('#checkMsg',e.message,1)}}renderQueue()}
$('#camIn').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
$('#galIn').addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});
function renderQueue(){$('#thumbs').innerHTML=queue.map((q,i)=>`<div><img src="${q.url}" alt="${esc(t('work',i+1))}"><button data-rm="${i}" aria-label="${esc(t('del'))}">×</button></div>`).join('');$('#runBtn').disabled=!queue.length;$('#runBtn').textContent=queue.length?t('runN',queue.length):t('run')}
$('#thumbs').addEventListener('click',e=>{const i=e.target.dataset.rm;if(i!==undefined){URL.revokeObjectURL(queue[i].url);queue.splice(+i,1);renderQueue()}});
$('#demoImg').addEventListener('click',async()=>{try{await document.fonts.load('40px Caveat')}catch(e){}const c=document.createElement('canvas');c.width=1000;c.height=1250;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1000,1250);x.strokeStyle='#c9d4ee';x.lineWidth=2;for(let y=150;y<1250;y+=62){x.beginPath();x.moveTo(0,y);x.lineTo(1000,y);x.stroke()}x.strokeStyle='#f0a0a0';x.beginPath();x.moveTo(110,0);x.lineTo(110,1250);x.stroke();x.fillStyle='#1d3a8f';x.font='46px Caveat, "Comic Sans MS", cursive';let y=138;L.sWritten.split('\n').forEach(par=>{let line='';par.split(' ').forEach(w=>{const s=line?line+' '+w:w;if(x.measureText(s).width>840){x.fillText(line,135,y);y+=62;line=w}else line=s});x.fillText(line,135,y);y+=62});const id=sampleTask();c.toBlob(b=>{queue.push({blob:b,url:URL.createObjectURL(b)});setMode('dict');renderTasks(id);renderQueue()},'image/jpeg',.9)});

/* ---------- AI ---------- */
const toB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)});
function prompt(){
 const ln=LANGNAME[cfg.lang];
 const common=`You are an assistant to a school language teacher. The image shows a student's handwritten work. The work may be in Uzbek (Latin), Russian, English or Tajik (Cyrillic).
1) Transcribe the text EXACTLY as the student wrote it. Do NOT correct spelling, capital letters or punctuation. If the student's name or class is written at the top of the page, put it in "name" and leave it out of "transcript".
2) Find the mistakes. For each mistake give: "written" — the exact fragment as it appears in "transcript" (for a missing word or punctuation mark, use the word just before it); "correct" — the correct form; "type" — one of "spelling" (wrong letters, apostrophe/diacritic, capital letter), "punct" (punctuation), "missing" (a missing word), "extra" (an extra word); "why" — a short explanation written in ${ln}.
If the handwriting is unclear, give the student the benefit of the doubt.`;
 const task=mode==='dict'?`\nOriginal dictation text (this is the correct version):\n"""${curTask().text}"""\nCompare the student's text with this original. Only differences from the original count as mistakes.`:`\nThis is a written exercise.${$('#fTask').value.trim()?' Task: "'+$('#fTask').value.trim()+'".':''} Check it against the spelling and punctuation rules of the language it is written in. In "comment" write 1-2 sentences in ${ln} about the content and how well it fits the task.`;
 return common+task+`\nReturn ONLY JSON, nothing else:\n{"name":"","transcript":"","errors":[{"written":"","correct":"","type":"spelling","why":""}],"comment":""}`}
function parse(x){const m=String(x).match(/\{[\s\S]*\}/);if(!m)throw new Error(t('badAI'));const j=JSON.parse(m[0]);const errs=Array.isArray(j.errors)?j.errors.filter(e=>e&&(e.written||e.correct)).map(e=>({written:String(e.written||''),correct:String(e.correct||''),type:OLDTYPE[e.type]||String(e.type||'spelling'),why:String(e.why||'')})):[];return{name:String(j.name||''),transcript:String(j.transcript||''),errors:errs,comment:String(j.comment||'')}}
function provider(){if(cfg.prov==='gemini'||cfg.prov==='claude')return cfg.key?cfg.prov:null;if(sample)return'sample';if(cfg.key)return cfg.key.startsWith('sk-ant')?'claude':'gemini';return null}
async function ask(blob){
 const p=provider(),text=prompt();
 if(p==='sample'){const r=await sample(text,{images:[blob],modelTier:'complex',cache:false});return parse(r.text)}
 const b64=await toB64(blob);
 if(p==='gemini'){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(cfg.key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:[{text},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Gemini '+r.status));return parse(j.candidates?.[0]?.content?.parts?.map(x=>x.text).join('')||'')}
 if(p==='claude'){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:4000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text}]}]})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Claude '+r.status));return parse(j.content?.map(x=>x.text||'').join('')||'')}
 throw new Error(t('needAI'))}
const curTask=()=>tasks.find(x=>x.id===$('#taskSel').value);
function msg(sel,x,bad){$(sel).innerHTML=x?`<div class="${bad?'note':'okmsg'}">${esc(x)}</div>`:''}

$('#runBtn').addEventListener('click',async()=>{
 if(mode==='dict'&&!curTask()){msg('#checkMsg',t('needTask'),1);return}
 if(!provider()){msg('#checkMsg',t('needAI'),1);return}
 const btn=$('#runBtn'),items=queue.splice(0);renderQueue();btn.disabled=true;$('#prog').classList.remove('hide');msg('#checkMsg','');
 const t0=Date.now();let done=0;$('#results').innerHTML='';
 for(const q of items){btn.innerHTML=`<span class="spin"></span> ${esc(t('checking',done+1,items.length))}`;
  try{const r=await ask(q.blob);const rec={id:'r'+Date.now()+Math.random().toString(36).slice(2,6),date:new Date().toISOString(),mode,taskId:mode==='dict'?curTask().id:'',taskTitle:mode==='dict'?curTask().title:($('#fTask').value.trim()||t('freeTitle')),name:r.name||t('studentN',results.length+1),transcript:r.transcript,errors:r.errors,comment:r.comment};results.unshift(rec);store.set('results',results);$('#results').insertAdjacentHTML('beforeend',`<div id="c-${rec.id}"></div>`);renderCard(rec,'#c-'+rec.id)}
  catch(e){$('#results').insertAdjacentHTML('beforeend',`<div class="note">${esc(t('work',done+1))}: ${esc(e.message||e)}</div>`);if(e.code==='rate_limited'||e.code==='not_granted')break}
  URL.revokeObjectURL(q.url);done++;$('#prog i').style.width=(done/items.length*100)+'%'}
 msg('#checkMsg',t('done',done,Math.round((Date.now()-t0)/1000),done*3));
 $('#prog').classList.add('hide');$('#prog i').style.width='0';renderQueue()});

/* ---------- result card ---------- */
function marked(tr,errs){const spans=[];errs.forEach(e=>{if(!e.written)return;let i=-1,from=0;while((i=tr.indexOf(e.written,from))>-1){const j=i+e.written.length;if(!spans.some(s=>i<s[1]&&j>s[0])){spans.push([i,j]);break}from=i+1}});spans.sort((a,b)=>a[0]-b[0]);let o='',p=0;spans.forEach(([a,b])=>{o+=esc(tr.slice(p,a))+'<mark>'+esc(tr.slice(a,b))+'</mark>';p=b});return o+esc(tr.slice(p))}
function renderCard(r,sel){const el=$(sel);if(!el)return;const g=grade(r.errors);
 el.innerHTML=`<div class="card"><div class="res"><div><label for="nm-${r.id}" style="margin-top:0">${esc(t('student'))}</label><input id="nm-${r.id}" value="${esc(r.name)}"><p class="mut" style="margin:6px 0 0">${esc(r.taskTitle)} · ${esc(t('errInfo',r.errors.length,score(r.errors)))}</p></div><div class="grade" aria-label="${esc(t('gradeAria',g))}">${g}</div></div>
 ${r.comment?`<div class="okmsg">${esc(r.comment)}</div>`:''}
 <div style="margin-top:8px">${r.errors.length?r.errors.map((e,i)=>`<div class="err"><span class="w">${esc(e.written||'—')}</span><span aria-hidden="true">→</span><span class="c">${esc(e.correct||'—')}</span><span class="t">${esc(typeName(e.type))}</span><button class="x" data-del="${i}">${esc(t('notError'))}</button>${e.why?`<span class="why">${esc(e.why)}</span>`:''}</div>`).join(''):`<div class="okmsg">${esc(t('noErrors'))}</div>`}</div>
 <details><summary>${esc(t('written'))}</summary><div class="tr">${marked(r.transcript,r.errors)}</div></details></div>`;
 el.querySelector('input').addEventListener('change',e=>{r.name=e.target.value.trim()||r.name;store.set('results',results)});
 el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{r.errors.splice(+b.dataset.del,1);store.set('results',results);renderCard(r,sel)}))}

/* ---------- journal ---------- */
const fmtDate=d=>{try{return new Date(d).toLocaleDateString(L.locale)}catch(e){return d.slice(0,10)}};
function renderJournal(){$('#jDetail').innerHTML='';if(!results.length){$('#jList').innerHTML=`<div class="card mut">${esc(t('noWorks'))}</div>`;return}
 const groups={};results.forEach(r=>(groups[r.taskTitle]??=[]).push(r));
 $('#jList').innerHTML=Object.entries(groups).map(([ti,rs])=>`<div class="card list"><h3>${esc(ti)} <span class="mut">· ${esc(t('grp',rs.length,avg(rs)))}</span></h3>${rs.map(r=>`<div class="it" data-open="${esc(r.id)}" tabindex="0"><span class="g">${grade(r.errors)}</span><span class="n">${esc(r.name)}<small>${esc(t('errs',r.errors.length))} · ${esc(fmtDate(r.date))}</small></span><button class="x" data-rmr="${esc(r.id)}" style="min-height:36px;font-size:13px">${esc(t('del'))}</button></div>`).join('')}</div>`).join('')}
$('#jList').addEventListener('click',e=>{const rm=e.target.closest('[data-rmr]');if(rm){results=results.filter(r=>r.id!==rm.dataset.rmr);store.set('results',results);renderJournal();return}const it=e.target.closest('[data-open]');if(it){const r=results.find(x=>x.id===it.dataset.open);$('#jDetail').innerHTML='<div id="jd"></div>';renderCard(r,'#jd');$('#jd').scrollIntoView({behavior:'smooth'})}});
$('#jList').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.open)e.target.click()});
$('#csvBtn').addEventListener('click',async()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"';const csv=[t('csvHead'),...results.map(r=>[fmtDate(r.date),r.name,r.taskTitle,r.errors.length,grade(r.errors)].map(q).join(','))].join('\n');try{await navigator.clipboard.writeText(csv);$('#csvBtn').textContent=t('csvDone')}catch(e){$('#jDetail').innerHTML=`<div class="card"><p class="mut">${esc(t('csvManual'))}</p><textarea>${esc(csv)}</textarea></div>`}setTimeout(()=>$('#csvBtn').textContent=t('csv'),2500)});

/* ---------- settings ---------- */
function renderSet(){$('#prov').value=cfg.prov;$('#key').value=cfg.key;['g5','g4','g3'].forEach(k=>$('#'+k).value=cfg[k]);const p=provider();$('#aiStat').textContent=t(p==='sample'?'connSample':p==='gemini'?'connGem':p==='claude'?'connClaude':'notConn')}
function saveCfg(){Object.assign(cfg,{prov:$('#prov').value,key:$('#key').value.trim(),g5:+$('#g5').value||0,g4:+$('#g4').value||0,g3:+$('#g3').value||0});store.set('cfg',cfg);renderSet()}
['#prov','#key','#g5','#g4','#g3'].forEach(s=>$(s).addEventListener('change',saveCfg));
let wipeArm=false;$('#wipe').addEventListener('click',()=>{if(!wipeArm){wipeArm=true;$('#wipe').textContent=t('wipeConfirm');return}results=[];store.set('results',results);wipeArm=false;$('#wipe').textContent=t('wipe');msg('#wipeMsg',t('wiped'))});

applyLang();
if(window.claude?.use)window.claude.use('sample').then(s=>{sample=s;if(curView==='set')renderSet()}).catch(()=>{});
}
</script>
</body>
