name: APK yig'ish

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Paketlarni o'rnatish
        run: npm ci
      - name: Veb fayllarni Android'ga ko'chirish
        run: npx cap sync android
      - name: APK yig'ish
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: APK'ni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: EduMate-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK nomini o'zgartirish
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EduMate.apk
      - name: Yuklab olish sahifasiga joylash (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EduMate (eng so'nggi versiya)
          body: "Telefonga o'rnatish uchun EduMate.apk faylini yuklab oling."
          files: EduMate.apk
          make_latest: true
