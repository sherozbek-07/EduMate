.emw{font-family:"EMWord",Nunito,system-ui,sans-serif;font-weight:900;letter-spacing:-.01em}.emw b{color:#ff5a5a;font-weight:900}
/* VOICE: calm, practical teacher's tool; quick to use between lessons
   IDEA: a school notebook checked with a red pen
   PICTURE: lined notebook page with red corrections and a circled grade
   COLOUR and TYPE: paper white, school-ink blue #1f3a93, red pen #d62f2f; Manrope + Caveat for handwriting
   LAYOUT: phone app: header, one working column, bottom tab bar */
:root{color-scheme:light dark;--bg:light-dark(#f6f7fb,#0e1220);--card:light-dark(#fff,#171c2e);--ink:light-dark(#141a2e,#e9ecf7);--mut:light-dark(#5c6480,#9aa3c0);--line:light-dark(#dfe3ef,#2a3150);--blue:light-dark(#1f3a93,#7d9bff);--blueBg:light-dark(#e8edfb,#1d2747);--red:#d62f2f;--redBg:light-dark(#fdecec,#3a1a1f);--ok:light-dark(#137a43,#4fd18b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;padding-bottom:84px}
header{background:var(--blue);color:#fff;padding:16px max(4vw,16px) 18px;padding-top:max(16px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;box-shadow:0 2px 10px #0b164033}
header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
header .hand{font-family:Caveat,cursive;font-size:22px;opacity:.85;margin-left:auto}
:root:not([data-theme=light]) header{background:light-dark(#1f3a93,#16234d)}
main{max-width:720px;margin:0 auto;padding:16px max(4vw,14px)}
h2{font-size:24px;line-height:1.15;margin:8px 0 12px}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:clamp(22px,6vw,30px);line-height:1.1;color:var(--blue)}
.stat span{font-size:13px;color:var(--mut)}
.hero{display:grid;gap:14px}
.hero svg{width:100%;height:auto;display:block;border-radius:16px}
button,.btn{font:600 16px Manrope,system-ui,sans-serif;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button.pri{background:var(--red);border-color:var(--red);color:#fff}
button.blue{background:var(--blue);border-color:var(--blue);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:16px Manrope,system-ui,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--blueBg);border-radius:12px;padding:4px;gap:4px;margin-bottom:6px}
.seg button{border:0;background:transparent;min-height:40px}
.seg button.on{background:var(--card);color:var(--blue);box-shadow:0 1px 3px #0002}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs div{position:relative;width:72px;height:92px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.thumbs .txt{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6px;text-align:center;font-size:11px;line-height:1.2;background:var(--blueBg);color:var(--blue);overflow-wrap:anywhere}
.thumbs .txt b{font:700 26px Caveat,cursive}
.thumbs button{position:absolute;top:2px;right:2px;min-height:26px;width:26px;padding:0;border-radius:50%;font-size:14px;background:#000a;color:#fff;border:0}
.res{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.grade{width:68px;height:68px;border:3px solid var(--red);border-radius:50%;display:grid;place-items:center;font:700 40px Caveat,cursive;color:var(--red);transform:rotate(-8deg)}
.err{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px dashed var(--line);font-size:15px}
.err .w{color:var(--red);text-decoration:line-through}
.err .c{color:var(--ok);font-weight:600}
.err .t{font-size:12px;background:var(--blueBg);color:var(--blue);padding:2px 8px;border-radius:99px;white-space:nowrap}
.err .x{margin-left:auto;min-height:34px;width:34px;padding:0;font-size:16px;border-radius:50%;flex:none}
.err .x:hover{color:var(--red);border-color:var(--red)}
.err.sh{padding:5px 0;border-top:0}.err.sh::before{content:"•";color:var(--red);font-weight:800}
.seg.sm{grid-template-columns:1fr 1fr;margin:12px 0 4px}.seg.sm button{min-height:34px;font-size:14px}
.err .why{flex-basis:100%;font-size:13px;color:var(--mut)}
.err{flex-wrap:nowrap;align-items:flex-start}.err .eb{flex:1;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.err.sh{align-items:center}
.tr{font-family:Caveat,cursive;font-size:22px;line-height:1.35;background:repeating-linear-gradient(transparent 0 28.7px,var(--line) 28.7px 29.7px);padding:2px 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.tr mark{background:none;color:var(--red);text-decoration:underline wavy var(--red);text-underline-offset:4px}
.mk{margin-top:12px}.mk img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}.mk .row{margin-top:8px}
details summary{cursor:pointer;color:var(--blue);font-weight:600;padding:6px 0}
.list .it{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.list .it:first-child{border-top:0}
.list .g{font:700 26px Caveat,cursive;color:var(--red);width:34px;text-align:center}
.list .n{flex:1}.list .n small{display:block;color:var(--mut);font-size:13px}
.note{background:var(--redBg);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.okmsg{background:var(--blueBg);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.prog{height:8px;background:var(--blueBg);border-radius:99px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .4s}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;flex-direction:column;gap:2px;font-size:12px;min-height:56px;color:var(--mut);padding:4px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--blue)}
.steps{display:grid;gap:10px;counter-reset:s}
.steps div{display:flex;gap:12px;align-items:flex-start}
.steps div::before{counter-increment:s;content:counter(s);flex:none;width:30px;height:30px;border-radius:50%;background:var(--blueBg);color:var(--blue);font-weight:800;display:grid;place-items:center}
.hide{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;clip-path:inset(50%)}
.spin{width:18px;height:18px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.prog i{transition:none}}
</style>
<style>
header #lang{width:auto;margin-left:auto;background:#ffffff1f;color:#fff;border:1px solid #ffffff55;min-height:40px;padding:6px 10px;font-weight:700;font-size:15px}
header #lang option{color:#141a2e}
header .hand{margin-left:0}
.btn{text-align:center;line-height:1.2}
@media(max-width:420px){header .hand{display:none}}
</style>
</head>

const LANGNAME={uz:'Uzbek (Latin script)',ru:'Russian',en:'English',tg:'Tajik (Cyrillic script)'};
const OLDTYPE={imlo:'spelling',ishora:'punct','tushib qolgan':'missing',ortiqcha:'extra'};

let mem={};
const store={get(k,d){try{const v=localStorage.getItem('em_'+k);return v?JSON.parse(v):(mem[k]??d)}catch(e){return mem[k]??d}},set(k,v){mem[k]=v;try{localStorage.setItem('em_'+k,JSON.stringify(v))}catch(e){}}};
let tasks=store.get('tasks',[]).filter(x=>x.id!=='t1');
let results=store.get('results',[]);
let cfg=Object.assign({prov:'auto',key:'',g5:0,g4:2,g3:5,detail:'full'},store.get('cfg',{}));
if(!cfg.lang){const n=(navigator.language||'uz').slice(0,2);cfg.lang=T[n]?n:'uz'}
let L=T[cfg.lang];
const t=(k,...a)=>{const v=L[k]??T.uz[k];return typeof v==='function'?v(...a):v};
const typeName=ty=>L.types[OLDTYPE[ty]||ty]||ty;
let mode='dict',queue=[],sample=null,curView='home';

function applyLang(){
 L=T[cfg.lang];document.documentElement.lang=cfg.lang;$('#lang').value=cfg.lang;
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $('#heroSvg').setAttribute('aria-label',t('heroAria'));
 const words=L.sWritten.split('\n')[1].split(' ');const lines=[];let cur='';words.forEach(w=>{if((cur+' '+w).length>22&&cur){lines.push(cur);cur=w}else cur=cur?cur+' '+w:w});lines.push(cur);
 document.querySelectorAll('#heroLines text').forEach((e,i)=>e.textContent=lines[i]||'');
 renderTasks($('#taskSel').value);renderQueue();renderStats();if(curView==='journal')renderJournal();if(curView==='set')renderSet()}
$('#lang').addEventListener('change',()=>{cfg.lang=$('#lang').value;store.set('cfg',cfg);applyLang()});

/* ---------- navigation ---------- */
const views=['home','check','journal','set'];
function go(v){curView=v;views.forEach(x=>$('#v-'+x).classList.toggle('hide',x!==v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===v));if(v==='home')renderStats();if(v==='journal')renderJournal();if(v==='set')renderSet();scrollTo(0,0)}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));

/* ---------- grading ---------- */
function score(errs){let s=0,p=0;errs.forEach(e=>(OLDTYPE[e.type]||e.type)==='punct'?p++:s++);return s+Math.floor(p/2)}
function grade(errs){const n=score(errs);return n<=cfg.g5?5:n<=cfg.g4?4:n<=cfg.g3?3:2}
const avg=rs=>(rs.reduce((a,r)=>a+grade(r.errors),0)/rs.length).toFixed(1);
function renderBanner(){const b=$('#keyBanner');if(b)b.classList.toggle('hide',!!provider())}
function renderStats(){renderBanner();$('#sCount').textContent=results.length;$('#sSaved').textContent=Math.round(results.length*2.5);$('#sAvg').textContent=results.length?avg(results):'–'}

/* ---------- tasks ---------- */
function sampleTask(){const id='sample-'+cfg.lang;if(!tasks.some(x=>x.id===id)){tasks.unshift({id,title:L.sTitle+' ('+L.sample+')',cls:'5-A',text:L.sText});store.set('tasks',tasks)}return id}
function renderTasks(sel){if(!tasks.length)sampleTask();$('#taskSel').innerHTML=tasks.map(x=>`<option value="${esc(x.id)}">${esc(x.title)}${x.cls?' · '+esc(x.cls):''}</option>`).join('')+`<option value="new">${esc(t('newDict'))}</option>`;if(sel&&tasks.some(x=>x.id===sel))$('#taskSel').value=sel;else if(sel==='new')$('#taskSel').value='new'}
let editId=null;
function openForm(task){editId=task?task.id:null;$('#tTitle').value=task?task.title:'';$('#tClass').value=task?task.cls:'';$('#tText').value=task?task.text:'';$('#tDel').classList.toggle('hide',!task);$('#newTask').classList.remove('hide');$('#tText').focus()}
$('#taskSel').addEventListener('change',()=>{if($('#taskSel').value==='new')openForm(null);else $('#newTask').classList.add('hide')});
$('#addTask').addEventListener('click',()=>{$('#taskSel').value='new';openForm(null)});
$('#editTask').addEventListener('click',()=>{const c=curTask();if(c)openForm(c)});
$('#tDel').addEventListener('click',()=>{if(!editId)return;tasks=tasks.filter(x=>x.id!==editId);store.set('tasks',tasks);editId=null;$('#newTask').classList.add('hide');renderTasks()});
$('#tSample').addEventListener('click',()=>{$('#tTitle').value=L.sTitle;$('#tClass').value='5-A';$('#tText').value=L.sText});
$('#tSave').addEventListener('click',()=>{const text=$('#tText').value.trim(),title=$('#tTitle').value.trim()||t('mDict');if(!text){$('#tText').focus();return}let x=editId&&tasks.find(k=>k.id===editId);if(x)Object.assign(x,{title,cls:$('#tClass').value.trim(),text});else{x={id:'t'+Date.now(),title,cls:$('#tClass').value.trim(),text};tasks.push(x)}store.set('tasks',tasks);editId=null;['#tTitle','#tClass','#tText'].forEach(s=>$(s).value='');$('#newTask').classList.add('hide');renderTasks(x.id)});
function setMode(m){mode=m;$('#mDict').classList.toggle('on',m==='dict');$('#mFree').classList.toggle('on',m==='free');$('#dictBox').classList.toggle('hide',m!=='dict');$('#freeBox').classList.toggle('hide',m!=='free')}

/* ---------- AI ---------- */
const toB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)});
function prompt(ctx){ctx=ctx||{mode,text:mode==='dict'?curTask().text:'',free:$('#fTask').value.trim()};
 const ln=LANGNAME[cfg.lang];
 const common=`You are an assistant to a school language teacher. The image shows a student's handwritten work. The work may be in Uzbek (Latin), Russian, English or Tajik (Cyrillic).
1) Transcribe the text EXACTLY as the student wrote it. Do NOT correct spelling, capital letters or punctuation. If the student's name or class is written at the top of the page, put it in "name" and leave it out of "transcript".
2) Find the mistakes. For each mistake give: "written" — the exact fragment as it appears in "transcript" (for a missing word or punctuation mark, use the word just before it); "correct" — the correct form; "type" — one of "spelling" (wrong letters, apostrophe/diacritic, capital letter), "punct" (punctuation), "missing" (a missing word), "extra" (an extra word); "why" — a short explanation written in ${ln}; "box" — the location of that fragment in the image as [ymin, xmin, ymax, xmax], normalized to 0-1000 (omit "box" when the work is given as text).
If the handwriting is unclear, give the student the benefit of the doubt.`;
 const task=ctx.mode==='dict'?`\nOriginal dictation text (this is the correct version):\n"""${ctx.text}"""\nCompare the student's text with this original. Only differences from the original count as mistakes.`:`\nThis is a written exercise.${ctx.free?' Task: "'+ctx.free+'".':''} Check it against the spelling and punctuation rules of the language it is written in. In "comment" write 1-2 sentences in ${ln} about the content and how well it fits the task.`;
 return common+task+`\nReturn ONLY JSON, nothing else:\n{"name":"","transcript":"","errors":[{"written":"","correct":"","type":"spelling","why":"","box":[0,0,0,0]}],"comment":""}`}
function parse(x){const m=String(x).match(/\{[\s\S]*\}/);if(!m)throw new Error(t('badAI'));const j=JSON.parse(m[0]);const errs=Array.isArray(j.errors)?j.errors.filter(e=>e&&(e.written||e.correct)).map(e=>({written:String(e.written||''),correct:String(e.correct||''),type:OLDTYPE[e.type]||String(e.type||'spelling'),why:String(e.why||''),box:Array.isArray(e.box)&&e.box.length===4&&e.box.every(n=>isFinite(n))&&e.box[2]>e.box[0]&&e.box[3]>e.box[1]?e.box.map(Number):null})):[];return{name:String(j.name||''),transcript:String(j.transcript||''),errors:errs,comment:String(j.comment||'')}}
function provider(){if(cfg.prov==='gemini'||cfg.prov==='claude')return cfg.key?cfg.prov:null;if(sample)return'sample';if(cfg.key)return cfg.key.startsWith('sk-ant')?'claude':'gemini';return null}
async function ask(q,ctx){
 let text=prompt(ctx);
 if(q.text!=null)text=text.replace('The image shows a student\'s handwritten work.','The student\'s work is given below as typed text, instead of an image.')+`\nStudent's name: "${q.name||''}"\nStudent's text:\n"""${q.text}"""\nUse this text as "transcript" without changing it.`;
 return parse(await callAI(text,q.blob))}
async function callAI(text,blob){
 const p=provider();
 if(p==='sample'){const r=await sample(text,Object.assign({modelTier:'complex',cache:false},blob?{images:[blob]}:{}));return r.text}
 const b64=blob?await toB64(blob):null;
 if(p==='gemini'){const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(cfg.key),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({contents:[{parts:b64?[{text},{inline_data:{mime_type:'image/jpeg',data:b64}}]:[{text}]}],generationConfig:{responseMimeType:'application/json',temperature:0}})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Gemini '+r.status));return j.candidates?.[0]?.content?.parts?.map(x=>x.text).join('')||''}
 if(p==='claude'){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:4000,messages:[{role:'user',content:b64?[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},{type:'text',text}]:[{type:'text',text}]}]})});const j=await r.json();if(!r.ok)throw new Error(j.error?.message||('Claude '+r.status));return j.content?.map(x=>x.text||'').join('')||''}
 throw new Error(t('needAI'))}

 msg('#checkMsg',t('done',done,Math.round((Date.now()-t0)/1000),done*3));$('#results').insertAdjacentHTML('beforeend',`<button type="button" class="pri" id="newCheck" style="width:100%;margin-bottom:14px">${esc(t('newCheck'))}</button>`);$('#newCheck').addEventListener('click',()=>{$('#results').innerHTML='';msg('#checkMsg','');scrollTo({top:0,behavior:'smooth'})});

/* ---------- photo store (IndexedDB) ---------- */
const memImg=new Map();let dbp=null;
function idb(){if(!dbp)dbp=new Promise((res)=>{try{const r=indexedDB.open('edumate',1);r.onupgradeneeded=()=>r.result.createObjectStore('imgs');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}});return dbp}
async function putImg(id,blob){memImg.set(id,blob);try{const d=await idb();if(d)d.transaction('imgs','readwrite').objectStore('imgs').put(blob,id)}catch(e){}}
async function getImg(id){if(memImg.has(id))return memImg.get(id);try{const d=await idb();if(!d)return null;return await new Promise(r=>{const q=d.transaction('imgs').objectStore('imgs').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function delImg(id){memImg.delete(id);try{const d=await idb();if(d)d.transaction('imgs','readwrite').objectStore('imgs').delete(id)}catch(e){}}

/* ---------- red-pen image ---------- */
async function drawMarked(blob,r){
 const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(blob)});
 try{await document.fonts.load('700 40px Caveat')}catch(e){}
 const W=img.naturalWidth,H=img.naturalHeight,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0);URL.revokeObjectURL(img.src);
 const RED='#d62f2f',lw=Math.max(3,Math.round(Math.min(W,H)/260)),hand=s=>`700 ${Math.round(s)}px Caveat, "Comic Sans MS", cursive`;
 x.lineCap='round';x.lineJoin='round';
 r.errors.forEach(e=>{if(!e.box)return;const[y0,x0,y1,x1]=e.box,X0=x0/1000*W,X1=x1/1000*W,Y0=y0/1000*H,Y1=y1/1000*H,h=Math.max(Y1-Y0,H/60);
  x.strokeStyle=RED;x.lineWidth=lw;
  const ty=OLDTYPE[e.type]||e.type;
  if(ty==='punct'||ty==='missing'){x.beginPath();x.moveTo(X1+lw,Y1);x.lineTo(X1+h*.25,Y1+h*.35);x.lineTo(X1+h*.5,Y1);x.stroke()}
  else{x.beginPath();const yy=Y1+lw;x.moveTo(X0,yy);for(let px=X0;px<=X1;px+=lw*2)x.lineTo(px+lw,yy+((px-X0)/(lw*2)%2?-lw:lw));x.lineTo(X1,yy);x.stroke()}
  if(e.correct){const fs=Math.max(18,h*.75);x.font=hand(fs);const tw=x.measureText(e.correct).width;let tx=Math.min(Math.max(4,X0),W-tw-4),tyy=Math.max(fs,Y0-fs*.15);
   x.fillStyle='rgba(255,255,255,.6)';x.fillRect(tx-4,tyy-fs*.85,tw+8,fs*1.02);x.fillStyle=RED;x.fillText(e.correct,tx,tyy)}});
 const g=grade(r.errors),R=Math.max(34,Math.min(W,H)*.075),cx=W-R*1.5,cy=R*1.5;
 x.fillStyle='rgba(255,255,255,.85)';x.beginPath();x.arc(cx,cy,R*1.05,0,7);x.fill();
 x.strokeStyle=RED;x.lineWidth=lw*1.4;x.beginPath();x.ellipse(cx,cy,R,R*.92,-.2,0,7);x.stroke();
 x.fillStyle=RED;x.font=hand(R*1.5);x.textAlign='center';x.textBaseline='middle';x.fillText(String(g),cx,cy+R*.05);
 x.font=hand(R*.5);x.fillText(`${r.errors.length} ${t('errShort')}`,cx,cy+R*1.45);
 return await new Promise(res=>c.toBlob(res,'image/jpeg',.9))}
let dl=null;if(window.claude?.use)window.claude.use('downloads').then(d=>dl=d).catch(()=>{});
async function saveImg(blob,name){
 const fn=('EduMate_'+name).replace(/[^\p{L}\p{N}_-]+/gu,'_')+'.jpg';const C=window.Capacitor;
 if(C?.isNativePlatform?.()){const data=await toB64(blob);const f=await C.nativePromise('Filesystem','writeFile',{path:fn,data,directory:'CACHE'});await C.nativePromise('Share','share',{title:name,files:[f.uri]});return}
 if(dl){await dl.save({filename:fn,data:blob});return}
 if(navigator.canShare?.({files:[new File([blob],fn,{type:'image/jpeg'})]})){await navigator.share({files:[new File([blob],fn,{type:'image/jpeg'})]});return}

function marked(tr,errs){const spans=[];errs.forEach(e=>{if(!e.written)return;let i=-1,from=0;while((i=tr.indexOf(e.written,from))>-1){const j=i+e.written.length;if(!spans.some(s=>i<s[1]&&j>s[0])){spans.push([i,j]);break}from=i+1}});spans.sort((a,b)=>a[0]-b[0]);let o='',p=0;spans.forEach(([a,b])=>{o+=esc(tr.slice(p,a))+'<mark>'+esc(tr.slice(a,b))+'</mark>';p=b});return o+esc(tr.slice(p))}

  catch(e){b.disabled=false;b.textContent=t('recheck');el.querySelector('.rcm').innerHTML=`<div class="note">${esc(e.message||e)}</div>`}});
